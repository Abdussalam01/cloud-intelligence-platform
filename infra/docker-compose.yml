services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ciop:${DB_PASSWORD}@db:5432/ciop
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=ciop
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=ciop
    volumes:
      - pgdata:/var/lib/postgresql/data


  scanner:
    build:
      context: ..
      dockerfile: infra/docker/scanner.Dockerfile
    environment:
      - DATABASE_URL=postgresql://ciop:${DB_PASSWORD}@db:5432/ciop
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
    depends_on:
      - db
    profiles:
      - tools

  sync:
    build:
      context: ..
      dockerfile: infra/docker/sync.Dockerfile
    environment:
      - DATABASE_URL=postgresql://ciop:${DB_PASSWORD}@db:5432/ciop
      - SERVICENOW_INSTANCE=${SERVICENOW_INSTANCE}
      - SERVICENOW_USER=${SERVICENOW_USER}
      - SERVICENOW_PASSWORD=${SERVICENOW_PASSWORD}
    depends_on:
      - db
    profiles:
      - tools

volumes:
  pgdata:

  