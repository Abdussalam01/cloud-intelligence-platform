services:
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ciop:${DB_PASSWORD}@db:5432/ciop
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=ciop
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=ciop
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: